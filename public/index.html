<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Emissor de Crachás - Zebra ZC100</title>
    <!-- Importando a biblioteca SheetJS para ler Excel (.xlsx / .xls) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; color: #333; }
        .container { display: flex; gap: 30px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 1100px; margin: auto; }
        .form-section { flex: 1.3; }
        .preview-section { flex: 0.7; display: flex; flex-direction: column; align-items: center; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 3px; font-size: 11px; }
        input, select, textarea { width: 100%; padding: 5px; box-sizing: border-box; font-size: 11px; }
        .btn-acao { background: #007bff; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 5px; font-size: 11px; }
        .btn-acao:hover { background: #0056b3; }
        .botoes-impressao { display: flex; gap: 8px; margin-top: 15px; }

        /* Dimensões dinâmicas do Canvas (Vertical vs Horizontal) */
        .badge-canvas {
            border: 1px solid #ccc;
            background: #fff;
            position: relative;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            overflow: hidden;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .badge-canvas.vertical { width: 204px; height: 323px; }
        .badge-canvas.horizontal { width: 323px; height: 204px; }

        /* ================= LAYOUTS VERTICAIS ================= */
        .vertical #faceFrente, .vertical #faceVerso { width: 100%; height: 100%; position: relative; }
        
        .vertical .topo-bloco {
            position: absolute; top: 0; left: 0; width: 100%; height: 68px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            padding: 0 5px; box-sizing: border-box;
        }
        .vertical .topo-bloco .nome-colaborador { font-size: 10px; font-weight: bold; line-height: 1.1; }
        .vertical .topo-bloco .funcao-colaborador { font-size: 8px; font-weight: normal; margin-top: 2px; opacity: 0.9; text-transform: uppercase; }

        .vertical .foto-container {
            position: absolute; top: 78px; left: 37px; width: 130px; height: 150px;
            border: 1.5px dashed #999; background: #eaeaea; background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; font-size: 10px; color: #555;
        }
        .vertical .baixo-bloco {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 45px;
            display: flex; align-items: center; justify-content: center; padding: 0 5px; box-sizing: border-box;
        }
        .vertical .logo-frente-img { max-height: 35px; max-width: 150px; width: auto; object-fit: contain; }

        /* Verso Vertical */
        .vertical #faceVerso { display: none; padding: 8px; box-sizing: border-box; background: #fff; flex-direction: column; justify-content: space-between; }
        .vertical .verso-topo { text-align: center; border-bottom: 1px solid #ddd; padding-bottom: 4px; width: 100%; display: flex; justify-content: center; align-items: center; }
        .vertical .logo-verso-img { max-height: 28px; max-width: 120px; object-fit: contain; }
        .vertical .verso-caixas { display: flex; flex-direction: column; gap: 5px; width: 100%; }
        .vertical .caixa-campo { border: 1px solid #444; border-radius: 3px; padding: 3px 5px; background: #fafafa; font-size: 8px; display: flex; flex-direction: column; }
        .vertical .caixa-campo span.titulo { font-weight: bold; color: #555; font-size: 7px; text-transform: uppercase; }
        .vertical .caixa-campo span.valor { font-weight: bold; color: #111; font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .vertical .verso-rodape-cultura { background: #f2f2f2; border: 1px solid #ccc; padding: 4px; font-size: 7px; line-height: 1.2; color: #222; text-align: justify; border-radius: 3px; max-height: 55px; overflow: hidden; }
        .vertical .verso-rodape-cultura strong { display: block; color: #000; margin-bottom: 1px; font-size: 7px; text-align: center; }

        /* ================= LAYOUTS HORIZONTAIS ================= */
        .horizontal #faceFrente, .horizontal #faceVerso { width: 100%; height: 100%; position: relative; }
        
        .horizontal .foto-container {
            position: absolute; top: 15px; left: 15px; width: 100px; height: 125px;
            border: 1.5px dashed #999; background: #eaeaea; background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; font-size: 9px; color: #555;
        }
        .horizontal .topo-bloco {
            position: absolute; top: 15px; left: 125px; right: 15px; height: 45px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            padding: 0 5px; box-sizing: border-box;
        }
        .horizontal .topo-bloco .nome-colaborador { font-size: 10px; font-weight: bold; line-height: 1.1; }
        .horizontal .topo-bloco .funcao-colaborador { font-size: 8px; font-weight: normal; margin-top: 2px; text-transform: uppercase; }

        .horizontal .baixo-bloco {
            position: absolute; bottom: 15px; left: 15px; width: 100px; height: 35px;
            display: flex; align-items: center; justify-content: center; padding: 0 5px; box-sizing: border-box;
        }
        .horizontal .logo-frente-img { max-height: 28px; max-width: 90px; object-fit: contain; }
        .horizontal .dados-horiz {
            position: absolute; top: 65px; left: 125px; right: 15px; display: flex; flex-direction: column; gap: 4px;
        }
        .horizontal .caixa-campo { border: 1px solid #444; border-radius: 3px; padding: 3px 5px; background: #fafafa; font-size: 8px; }

        /* Verso Horizontal (Ajustado com topo centralizado para a logo não estourar) */
        .horizontal #faceVerso { display: none; padding: 10px; box-sizing: border-box; background: #fff; flex-direction: column; justify-content: space-between; }
        .horizontal .verso-topo { text-align: center; border-bottom: 1px solid #ddd; padding-bottom: 4px; width: 100%; display: flex; justify-content: center; align-items: center; }
        .horizontal .logo-verso-img { max-height: 25px; max-width: 140px; object-fit: contain; }

        .tabs { display: flex; margin-bottom: 8px; gap: 5px; }
        .tabs button { margin: 0; padding: 5px; font-size: 11px; background: #6c757d; border: none; color: white; border-radius: 3px; cursor: pointer; flex: 1; }
        .tabs button.active { background: #007bff; }

        /* Configuração de Impressão Térmica Dinâmica */
        @media print {
            @page { size: 54mm 85.6mm; margin: 0; }
            body, html { margin: 0 !important; padding: 0 !important; background: #fff !important; overflow: hidden !important; }
            .form-section, .tabs, .botoes-impressao, h3, p { display: none !important; }
            .container { display: block !important; padding: 0 !important; margin: 0 !important; border: none !important; box-shadow: none !important; background: #fff !important; }
            .preview-section { display: block !important; margin: 0 !important; padding: 0 !important; }
            #badgeCanvas { position: fixed !important; left: 0 !important; top: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; z-index: 9999 !important; }
            
            body.imprimir-frente #faceFrente { display: block !important; visibility: visible !important; }
            body.imprimir-frente #faceVerso { display: none !important; }
            body.imprimir-verso #faceVerso { display: flex !important; visibility: visible !important; }
            body.imprimir-verso #faceFrente { display: none !important; }

            img, .foto-container { image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-section">
            <h3 style="margin-top:0; font-size: 15px;">Gerador de Crachás - Zebra ZC100</h3>
            
            <!-- Seletor de Modelos -->
            <div class="form-group" style="background: #e2e6ea; padding: 8px; border-radius: 5px;">
                <label style="color: #333;">🎨 Escolher Modelo:</label>
                <select id="selectTemplate" onchange="mudarTemplate()">
                    <optgroup label="Modelos com Função do Funcionário">
                        <option value="v-funcao-preto">1. Vertical: Clássico com Função (Preto)</option>
                        <option value="v-funcao-azul">2. Vertical: Corporativo com Função (Azul)</option>
                        <option value="v-funcao-verde">3. Vertical: Operacional com Função (Verde)</option>
                        <option value="h-funcao-azul">4. Horizontal: Executivo com Função (Azul)</option>
                        <option value="h-funcao-preto">5. Horizontal: Clássico com Função (Preto)</option>
                    </optgroup>
                    <optgroup label="Modelos Padrão">
                        <option value="v-classico-preto">6. Vertical: Clássico Simples (Preto)</option>
                        <option value="v-executivo-azul">7. Vertical: Executivo Simples (Azul)</option>
                        <option value="v-moderno-verde">8. Vertical: Moderno Verde</option>
                        <option value="h-classico-preto">9. Horizontal: Clássico Simples</option>
                        <option value="h-executivo-azul">10. Horizontal: Executivo Simples</option>
                    </optgroup>
                </select>
            </div>

            <!-- Botão de Importar Excel -->
            <div class="form-group" style="background: #e9ecef; padding: 10px; border-radius: 5px; border: 1px dashed #ced4da;">
                <label style="color: #0056b3;">📊 Importar Base de Dados (Excel):</label>
                <input type="file" id="fileExcel" accept=".xlsx, .xls, .csv" onchange="importarExcel(event)">
                <small id="statusPlanilha" style="color: #28a745; font-weight: bold; display: block; margin-top: 4px;"></small>
            </div>

            <form id="formCracha" onsubmit="event.preventDefault();">
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Matrícula:</label>
                        <input type="text" id="txtMatricula" placeholder="Matrícula..." oninput="buscarPorMatricula()">
                    </div>
                    <div class="form-group" style="flex: 1.5;">
                        <label>Nome no Crachá:</label>
                        <input type="text" id="txtNome" placeholder="Ex: ISABELA LIMA" oninput="sincronizarNomes()">
                    </div>
                </div>

                <div class="form-group">
                    <label>Função / Cargo:</label>
                    <input type="text" id="txtFuncao" placeholder="Ex: Analista de Suporte" oninput="sincronizarFuncao()">
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Origem da Foto:</label>
                        <select id="tipoFoto" onchange="alternarOrigemFoto()">
                            <option value="link">Link da Internet</option>
                            <option value="pc">Arquivo do PC</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;" id="divInputFotoLink">
                        <label>Link da Foto:</label>
                        <input type="text" id="txtFotoUrl" placeholder="https://..." oninput="atualizarCampos()">
                    </div>
                    <div class="form-group" style="flex: 1; display: none;" id="divInputFotoPc">
                        <label>Arquivo Foto (PC):</label>
                        <input type="file" id="fileFotoPc" accept="image/*" onchange="carregarFotoLocal(event)">
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Logo Frente (PC):</label>
                        <input type="file" id="fileLogoFrente" accept="image/*" onchange="carregarLogoFrente(event)">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Logo Verso (PC):</label>
                        <input type="file" id="fileLogoVerso" accept="image/*" onchange="carregarLogoVerso(event)">
                    </div>
                </div>

                <hr style="margin: 10px 0; border:0; border-top:1px solid #ddd;">
                <h4 style="margin: 0 0 6px 0; font-size: 12px; color: #444;">Dados do Verso</h4>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1.5;">
                        <label>RG:</label>
                        <input type="text" id="txtRg" placeholder="00.000.000-0" oninput="atualizarCampos()">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Data de Admissão:</label>
                        <input type="text" id="txtAdmissao" placeholder="DD/MM/AAAA" oninput="atualizarCampos()">
                    </div>
                </div>

                <div class="form-group">
                    <label>Texto / Cultura do Rodapé (Verso):</label>
                    <textarea id="txtRodape" rows="2" oninput="atualizarRodape()">SURPREENDER o cliente com PROFISSIONALISMO e sempre oferecer uma NOVIDADE para superar suas expectativas.</textarea>
                </div>
            </form>

            <div class="botoes-impressao">
                <button class="btn-acao" style="background: #28a745;" onclick="imprimir('frente')">🖨️ Imprimir Frente</button>
                <button class="btn-acao" style="background: #17a2b8;" onclick="imprimir('verso')">🖨 Imprimir Verso</button>
            </div>
        </div>

        <div class="preview-section">
            <h3 style="margin-top:0; font-size: 14px;">Pré-visualização</h3>
            <div class="tabs">
                <button id="btnTabFrente" class="active" onclick="mudarFace('frente')">Frente</button>
                <button id="btnTabVerso" onclick="mudarFace('verso')">Verso</button>
            </div>

            <!-- Canvas do Crachá Dinâmico -->
            <div id="badgeCanvas" class="badge-canvas vertical">
                
                <!-- FRENTE -->
                <div id="faceFrente">
                    <div class="topo-bloco" id="elTopoFrente">
                        <span class="nome-colaborador" id="elNomeFrente">NOME DO COLABORADOR</span>
                        <span class="funcao-colaborador" id="elFuncaoFrente" style="display: none;">FUNÇÃO</span>
                    </div>
                    <div class="foto-container" id="elFoto">Foto 3x4</div>
                    <div class="baixo-bloco" id="elBaixoFrente">
                        <img id="elLogoFrente" class="logo-frente-img" alt="Logo Frente">
                    </div>
                    <div id="elDadosHoriz" class="dados-horiz" style="display: none;">
                        <div class="caixa-campo"><span class="titulo">RG:</span> <span class="valor" id="elRgHoriz">---</span></div>
                        <div class="caixa-campo"><span class="titulo">Admissão:</span> <span class="valor" id="elAdmissaoHoriz">---</span></div>
                        <div class="caixa-campo"><span class="titulo">Matrícula:</span> <span class="valor" id="elMatriculaHoriz">---</span></div>
                    </div>
                </div>

                <!-- VERSO -->
                <div id="faceVerso">
                    <div class="verso-topo">
                        <img id="elLogoVerso" class
